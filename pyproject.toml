[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-flow-owf002"
version = "0.1.0"
description = "Deterministic, composable workflow framework for GitHub Copilot CLI and compatible agent environments"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [{name = "AIPubs Cloud"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "PyYAML>=6,<7",
]

[project.scripts]
owf002-explore = "owf002.repo_explorer:main"

[project.optional-dependencies]
dev = [
  "pytest>=7,<9",
  "pyyaml>=6,<7",
  "jsonschema>=4,<5",
]
test = [
  "pytest>=7,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
