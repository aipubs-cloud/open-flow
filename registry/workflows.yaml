registry:
  name: AIPubs Open Flow Workflow Registry
  version: 1.0.0
  schema: schemas/registry.schema.json
  manifest_root: workflows
  discovery: filesystem
  lifecycle:
    experimental: usable_not_stable
    active: stable_discoverable
    deprecated: resolvable_prefer_replacement
    retired: blocked_without_migration_exception

