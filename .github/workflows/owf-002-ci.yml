name: OWF-002 CI

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'schemas/**'
      - 'pyproject.toml'
      - '.github/workflows/owf-002-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'schemas/**'
      - 'pyproject.toml'
      - '.github/workflows/owf-002-ci.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m pytest -q
