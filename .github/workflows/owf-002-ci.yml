name: OWF-002 CI

on:
  push:
    paths:
      - 'workflows/002-repository-explorer/**'
      - 'tests/test_owf_002.py'
      - 'schemas/workflow.schema.json'
      - 'pyproject.toml'
      - '.github/workflows/owf-002-ci.yml'
  pull_request:
    paths:
      - 'workflows/002-repository-explorer/**'
      - 'tests/test_owf_002.py'
      - 'schemas/workflow.schema.json'
      - 'pyproject.toml'
      - '.github/workflows/owf-002-ci.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run OWF-002 tests
        run: python -m pytest -q tests/test_owf_002.py
