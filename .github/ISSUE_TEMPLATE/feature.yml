name: Feature request
description: Propose a bounded improvement to OWF.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or engineering problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Contract impact
      description: Explain affected workflows, schemas, capabilities, safety modes, or compatibility.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: How will success be measured?
    validations:
      required: true
