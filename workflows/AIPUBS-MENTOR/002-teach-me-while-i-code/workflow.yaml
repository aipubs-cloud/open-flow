id: AIPUBS-MENTOR-002
name: Teach Me While I Code
version: 0.1.0
category: mentor
level: beginner
mode: guided
objective: Teach software development concepts continuously during an implementation task.
inputs:
  - implementation-task
  - learner-level
outputs:
  - implementation-change
  - lesson-record
  - verification-evidence
steps:
  - plan_task
  - explain_plan
  - implement_incrementally
  - explain_each_change
  - run_tests
  - verify_behavior
  - teach_key_concepts
  - assign_practice
graduation:
  - implementation_verified
  - lesson_recorded
  - practice_exercise_created
safety:
  destructive_operations: false
  force_push: false
  modifies_files: true
  requires_confirmation_before_modification: true
